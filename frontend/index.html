<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payloop</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      max-width: 900px;
      margin: 0 auto 2rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
    }

    #cards-container {
      max-width: 900px;
      margin: 0 auto;
    }

    #cards-loading {
      color: #64748b;
      text-align: center;
      padding: 2rem;
    }
  </style>
    <script type="importmap">
    {
      "imports": {
        "@capitalos/js": "https://cdn.jsdelivr.net/npm/@capitalos/js/dist/index.js"
      }
    }
    </script>
</head>
<body>

  <header>
    <h1>Blinkbid</h1>
  </header>

  <div id="cards-container">
    <div id="cards-loading">Carregando...</div>
    <div id="capitalos-cards" hidden></div>
  </div>

  <script type="module">
    import { createCapitalOsClient } from "@capitalos/js"

    async function getToken() {
      const res = await fetch("/api/get-capitalos-token")
      console.log(res)
      const data = await res.json()
      return data.token
    }

    const loadingEl  = document.getElementById("cards-loading")
    const container  = document.getElementById("capitalos-cards")
    const capitalOs  = createCapitalOsClient({ getToken })

    const cardsApp = capitalOs.mountCardsApp(container, {
      onLoaded: () => {
        loadingEl.hidden   = true
        container.hidden   = false
      },
      onError: (error) => {
        console.error("CapitalOS error:", error)
        loadingEl.textContent = "Erro ao carregar. Tente novamente."
      },
    })

    window.addEventListener("beforeunload", () => cardsApp.destroy())
  </script>

</body>
</html>
